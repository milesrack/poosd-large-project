name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # MongoDB 8.0 requires a kernel below 6.19 (SERVER-121912).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/setup-env.ts
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
        env:
          ZETAFLY_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - run: npm run model:fetch
      - run: npm run check
      - run: npm run test:simulator
      - run: docker compose up --build -d --wait
      - name: Database and model runtime
        run: |
          docker compose exec -T app node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { randomUUID } from "node:crypto";
          import { MongoClient } from "mongodb";
          import { prepareDatabase } from "./server/database.ts";
          import { NeuralWorker } from "./server/neural-worker.ts";
          const client = await new MongoClient(process.env.MONGODB_URI).connect();
          const db = client.db(`zetafly_migration_${randomUUID().replaceAll("-", "")}`);
          try {
            await db.collection("sessions").insertOne({
              id: "legacy", ownerId: "alice", startedAt: new Date(0), events: [],
            });
            await db.collection("sessions").createIndex({ id: 1 }, { unique: true });
            const original = await db.collection("sessions").findOne({ id: "legacy" });
            await db.collection("session").insertOne({ id: "auth" });
            await prepareDatabase(db);
            assert.deepEqual(await db.collection("runs").findOne({ id: "legacy" }), original);
            assert.equal(await db.listCollections({ name: "sessions" }).hasNext(), false);
            assert.equal(await db.collection("session").countDocuments({}), 1);
            await prepareDatabase(db);
            assert.equal(await db.collection("runs").countDocuments({}), 1);
            assert.ok((await db.collection("runs").indexes()).some(index => index.unique && index.key.id === 1));
            await db.collection("sessions").insertOne({ id: "collision" });
            await assert.rejects(prepareDatabase(db));
            assert.equal(await db.collection("runs").countDocuments({}), 1);
            assert.equal(await db.collection("sessions").countDocuments({}), 1);
          } finally {
            await db.dropDatabase();
            await client.close();
          }
          const worker = new NeuralWorker();
          try {
            for (const [a, b, operation, answer] of [
              [2, 3, "+", "5"], [5, 2, "-", "3"],
              [2, 3, "*", "6"], [6, 2, "/", "3"],
            ]) {
              let first;
              const prediction = await worker.predict(a, b, 42, operation, packet => {
                first ??= packet.neural.rates?.[0];
              });
              assert.equal(prediction.answerText, answer);
              assert.ok(prediction.neural?.rates?.length);
              assert.ok(first);
              assert.ok(prediction.neural.rates.some(sample => sample[0] === first[0] && sample[1] === first[1]));
            }
            await worker.close();
            assert.equal((await worker.predict(2, 3, 42, "+")).answerText, "5");
          } finally {
            await worker.close();
          }
          JS
      - run: npm run test:integration
      - name: Sync private SwaggerHub definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SWAGGERHUB_OWNER != ''
        env:
          SWAGGERHUB_OWNER: ${{ vars.SWAGGERHUB_OWNER }}
          SWAGGERHUB_API_KEY: ${{ secrets.SWAGGERHUB_API_KEY }}
        run: npm run api:sync
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
  ui:
    name: ui (${{ matrix.check }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [sound, auth-ui, playback]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web
      - name: Browser checks
        env:
          DEBUG: pw:api,pw:browser
        run: |
          node --input-type=module > /tmp/zetafly-ui.log 2>&1 <<'JS' &
          import express from "express";
          import { securityHeaders } from "./server/security.ts";
          const app = express();
          app.use(securityHeaders(false));
          app.use(express.static("web/dist"));
          app.listen(3000, "127.0.0.1");
          JS
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ >/dev/null
          node scripts/verify-${{ matrix.check }}.ts
      - name: Server diagnostics
        if: failure()
        run: cat /tmp/zetafly-ui.log
  publish:
    needs: [checks, ui]
    if: github.event_name == 'push' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare image name
        id: image
        run: printf 'repository=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
