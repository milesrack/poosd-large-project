name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://zetafly.poosd.dev
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Prepare image name
        id: image
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          printf 'repository=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published image
        id: release
        env:
          IMAGE_TAG: ${{ steps.image.outputs.repository }}:${{ env.RELEASE_SHA }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s@%s\n' "${IMAGE_TAG%:*}" "$digest" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH'
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            ServerAliveInterval 30
          SSH

      - name: Upload Compose files
        run: |
          ssh deploy@"$DEPLOY_HOST" "mkdir -p /var/www/zetafly/releases/$RELEASE_SHA"
          rsync -az --no-owner --no-group compose.yaml compose.production.yaml \
            "deploy@$DEPLOY_HOST:/var/www/zetafly/releases/$RELEASE_SHA/"

      - name: Deploy image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          [[ "$IMAGE" =~ ^ghcr.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9-]+$ ]]
          {
            printf '%s\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail
          release=/var/www/zetafly/releases/$1
          cd "$release"
          test -r /var/www/zetafly/shared/.env
          ln -sfn /var/www/zetafly/shared/.env .env
          printf 'ZETAFLY_IMAGE=%s\n' "$2" > image.env
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$registry_token" | docker login ghcr.io --username "$3" --password-stdin >/dev/null
          unset registry_token
          compose=(docker compose -p zetafly --env-file .env --env-file image.env -f compose.yaml -f compose.production.yaml)
          "${compose[@]}" pull
          "${compose[@]}" up -d --no-build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://zetafly.poosd.dev/api/health >/dev/null
          ln -sfn "$release" /var/www/zetafly/current
          REMOTE
          } | ssh deploy@"$DEPLOY_HOST" \
            "IFS= read -r registry_token; export registry_token; exec bash -se -- '$RELEASE_SHA' '$IMAGE' '$REGISTRY_USER'"
