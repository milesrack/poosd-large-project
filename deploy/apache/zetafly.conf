<VirtualHost *:80>
    ServerName zetafly.poosd.dev
    ServerAlias poosd.dev www.poosd.dev
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://zetafly.poosd.dev/$1
</VirtualHost>

<VirtualHost *:443>
    ServerName poosd.dev
    ServerAlias www.poosd.dev
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/poosd.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/poosd.dev/privkey.pem
    Redirect permanent / https://zetafly.poosd.dev/
</VirtualHost>

<VirtualHost *:443>
    ServerName zetafly.poosd.dev
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/zetafly.poosd.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/zetafly.poosd.dev/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto https
    ProxyPass / http://127.0.0.1:3000/ upgrade=websocket timeout=600
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/zetafly-error.log
    CustomLog ${APACHE_LOG_DIR}/zetafly-access.log combined
</VirtualHost>
