      tags:
        - Authentication
  /api/auth/revoke-sessions:
    post:
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                required:
                  - status
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Revoke all sessions for the user
