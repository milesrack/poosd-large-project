openapi: 3.0.3
info:
  title: Zetafly API
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: "{origin}"
    variables:
      origin:
        default: https://zetafly.poosd.dev
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check database availability
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                      - unavailable
      tags:
        - System
  /api/weights:
    get:
      operationId: searchWeights
      summary: Search checkpoint names
      description: Searches your uploaded checkpoints and the default profile.
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - name: q
          in: query
          description: >-
            Case-insensitive substring, trimmed and matched literally. Omit to list all available
            checkpoints.
          schema:
            type: string
            maxLength: 100
          example: train
      responses:
        "200":
          description: Matching checkpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightProfile"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Weights
    post:
      operationId: uploadWeights
      summary: Upload an NPZ checkpoint
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - name: x-filename
          in: header
          required: true
          description: URI-encoded filename ending in .npz; at most 100 characters after decoding.
          schema:
            type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightProfile"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "408":
          $ref: "#/components/responses/Error408"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Sequence-model NPZ checkpoint, at most 64 MiB. Up to five uploads per account.
      tags:
        - Weights
  /api/public-config:
    get:
      operationId: getPublicConfig
      summary: Get public configuration
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - localInbox
                properties:
                  localInbox:
                    type: string
                    nullable: true
        "403":
          $ref: "#/components/responses/Error403"
      tags:
        - System
  /api/access:
    post:
      operationId: grantAccess
      summary: Set the API access cookie
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - System
  /api/preferences:
    get:
      operationId: getPreferences
      summary: Get preferences
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Preferences
    put:
      operationId: updatePreferences
      summary: Save preferences
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Preferences
  /api/weights/{id}/file:
    get:
      operationId: downloadWeights
      summary: Download a checkpoint
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: NPZ checkpoint
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Weights
  /api/weights/{id}:
    delete:
      operationId: deleteWeights
      summary: Delete an uploaded checkpoint
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Weights
  /api/runs:
    get:
      operationId: listRuns
      summary: List the latest 20 runs
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSummary"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Runs
  /api/runs/{id}:
    get:
      operationId: getRun
      summary: Get a run and its recorded events
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Runs
  /api/preview:
    post:
      operationId: previewGame
      summary: Prepare the game preview
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Runs
  /api/start:
    post:
      operationId: startRun
      summary: Start a new run
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Runs
  /api/stop:
    post:
      operationId: stopRun
      summary: Stop the current run
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
      tags:
        - Runs
  /api/auth/sign-up/email:
    post:
      operationId: signUpWithEmailAndPassword
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  type: string
                password:
                  type: string
                  minLength: 15
                  maxLength: 128
                  description: Common, breached, and easily guessed passwords are rejected.
                image:
                  type: string
                callbackURL:
                  type: string
                rememberMe:
                  type: boolean
              required:
                - name
                - email
                - password
        required: true
      responses:
        "200":
          description: Successfully created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    nullable: true
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      image:
                        type: string
                        format: uri
                        nullable: true
                      emailVerified:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - email
                      - name
                      - emailVerified
                      - createdAt
                      - updatedAt
                required:
                  - user
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "422":
          description: Unprocessable Entity. User already exists or failed to create user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Sign up a user using email and password
      tags:
        - Authentication
  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                callbackURL:
                  type: string
                rememberMe:
                  type: boolean
              required:
                - email
                - password
      responses:
        "200":
          description: Success - Returns either session details or redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect:
                    type: boolean
                    enum:
                      - false
                  token:
                    type: string
                  url:
                    type: string
                    nullable: true
                  user:
                    type: object
                    $ref: "#/components/schemas/User"
                required:
                  - redirect
                  - token
                  - user
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Sign in with email and password
      tags:
        - Authentication
  /api/auth/get-session:
    get:
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - session
                  - user
                nullable: true
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Get the current session
      tags:
        - Authentication
    post:
      operationId: getSessionPost
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - session
                  - user
                nullable: true
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Get the current session
      tags:
        - Authentication
  /api/auth/sign-out:
    post:
      operationId: signOut
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackURL:
                  type: string
                disableRedirect:
                  type: boolean
                state:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  url:
                    type: string
                  redirect:
                    type: boolean
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Sign out the current user
      tags:
        - Authentication
  /api/auth/send-verification-email:
    post:
      operationId: sendVerificationEmail
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                callbackURL:
                  type: string
                  nullable: true
              required:
                - email
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Send a verification email to the user
      tags:
        - Authentication
  /api/auth/verify-email:
    get:
      security: []
      parameters:
        - name: token
          in: query
          description: The token to verify the email
          required: true
          schema:
            type: string
        - name: callbackURL
          in: query
          description: The URL to redirect to after email verification
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    $ref: "#/components/schemas/User"
                  status:
                    type: boolean
                required:
                  - user
                  - status
        "302":
          description: Redirect
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Verify the email of the user
      operationId: get_verify_email
      tags:
        - Authentication
  /api/auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                redirectTo:
                  type: string
              required:
                - email
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Send a password reset email to the user
      tags:
        - Authentication
  /api/auth/reset-password:
    post:
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                  minLength: 15
                  maxLength: 128
                token:
                  type: string
              required:
                - newPassword
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Reset the password for a user
      tags:
        - Authentication
  /api/auth/reset-password/{token}:
    get:
      operationId: resetPasswordCallback
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The token to reset the password
          schema:
            type: string
        - name: callbackURL
          in: query
          required: true
          description: The URL to redirect the user to reset their password
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "302":
          description: Redirect
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Redirects the user to the callback URL with the token
      tags:
        - Authentication
  /api/auth/verify-password:
    post:
      operationId: verifyPassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Verify the current user's password
      tags:
        - Authentication
  /api/auth/change-password:
    post:
      operationId: changePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                currentPassword:
                  type: string
                revokeOtherSessions:
                  type: boolean
              required:
                - newPassword
                - currentPassword
      responses:
        "200":
          description: Password successfully changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    nullable: true
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      image:
                        type: string
                        format: uri
                        nullable: true
                      emailVerified:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - email
                      - name
                      - emailVerified
                      - createdAt
                      - updatedAt
                required:
                  - user
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
