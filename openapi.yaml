        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: List all accounts linked to the user
      tags:
        - Authentication
  /api/auth/token:
    get:
      operationId: getJSONWebToken
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Get a JWT token
      tags:
        - Authentication
  /api/auth/jwks:
    get:
      operationId: getJSONWebKeySet
      security: []
      responses:
        "200":
          description: JSON Web Key Set retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kid:
                          type: string
                        kty:
                          type: string
                        alg:
                          type: string
                        use:
                          type: string
                          enum:
                            - sig
                          nullable: true
                        "n":
                          type: string
                          nullable: true
                        e:
                          type: string
                          nullable: true
                        crv:
                          type: string
                          nullable: true
                        x:
                          type: string
                          nullable: true
                        "y":
                          type: string
                          nullable: true
                      required:
                        - kid
                        - kty
                        - alg
                required:
                  - keys
        "400":
          $ref: "#/components/responses/AuthError400"
        "401":
          $ref: "#/components/responses/AuthError401"
        "403":
          $ref: "#/components/responses/AuthError403"
        "404":
          $ref: "#/components/responses/AuthError404"
        "429":
          $ref: "#/components/responses/AuthError429"
        "500":
          $ref: "#/components/responses/AuthError500"
      summary: Get the JSON Web Key Set
      tags:
        - Authentication
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from GET /api/auth/token. Expires after five minutes.
    accessCookie:
      type: apiKey
      in: cookie
      name: zetafly_access
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: Session cookie set by sign-in. Local HTTP uses better-auth.session_token.
  responses:
    Forbidden:
      description: Origin not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: Unauthorised
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error408:
      description: Upload timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error413:
      description: Request too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error415:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthError400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    AuthError401:
      description: Unauthorised
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    AuthError403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    AuthError404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    AuthError429:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
    AuthError500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
  schemas:
    Error:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: string
    WeightProfile:
      type: object
      required:
        - id
        - name
        - features
        - arithmeticMode
        - synaptic
        - sha256
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        features:
          type: integer
          minimum: 0
        arithmeticMode:
          type: string
          enum:
            - sequence
        synaptic:
          type: boolean
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        bytes:
          type: integer
          minimum: 1
          description: Uploaded checkpoint size in bytes.
        createdAt:
          type: string
          format: date-time
          description: Upload timestamp.
    Success:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    Status:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    Settings:
      allOf:
        - $ref: "#/components/schemas/SettingsFields"
        - type: object
          required:
            - add
            - sub
            - mul
            - div
            - add_left_min
            - add_left_max
            - add_right_min
            - add_right_max
            - mul_left_min
            - mul_left_max
            - mul_right_min
            - mul_right_max
            - duration
            - profileId
    SettingsInput:
      allOf:
        - $ref: "#/components/schemas/SettingsFields"
    RunEvent:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - motor
            - input
            - attempt
            - prediction
        time:
          type: number
      description: Recorded motor, browser input, submitted answer, or model prediction. Fields depend on kind.
    RunSummary:
      type: object
      required:
        - id
        - ownerId
        - startedAt
        - finishedAt
        - status
        - attempts
        - accepted
        - protocol
        - settings
      properties:
        _id:
          type: string
        id:
          type: string
        ownerId:
          type: string
        profile:
          type: object
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
        error:
          type: string
          nullable: true
        attempts:
          type: integer
        accepted:
          type: integer
        protocol:
          type: string
        settings:
          $ref: "#/components/schemas/Settings"
    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          required:
            - events
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/RunEvent"
    User:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          default: false
          readOnly: true
        image:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - emailVerified
        - createdAt
        - updatedAt
    Session:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string
        userId:
          type: string
      required:
        - id
        - expiresAt
        - token
        - createdAt
        - updatedAt
        - userId
    Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        accountId:
          type: string
        providerId:
          type: string
        userId:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        idToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        scope:
          type: string
        password:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - accountId
        - providerId
        - userId
        - createdAt
        - updatedAt
    SettingsFields:
      type: object
      properties:
        add:
          type: boolean
        sub:
          type: boolean
        mul:
          type: boolean
        div:
          type: boolean
        add_left_min:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        add_left_max:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        add_right_min:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        add_right_max:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        mul_left_min:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        mul_left_max:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        mul_right_min:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        mul_right_max:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        duration:
          type: integer
          enum:
            - 30
            - 60
            - 120
            - 300
            - 600
        profileId:
          type: string
          pattern: ^(published|[a-f0-9-]{36})$
      additionalProperties: false
      description: >-
        At least one operation must be enabled. Each minimum must not exceed its maximum; enabled
        operations must remain within safe integer precision.
    AuthError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
