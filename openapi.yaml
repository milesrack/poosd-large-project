  /api/auth/list-accounts:
    get:
      operationId: listUserAccounts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    providerId:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    accountId:
                      type: string
                    userId:
                      type: string
                    scopes:
                      type: array
                      items:
                        type: string
                  required:
                    - id
                    - providerId
                    - createdAt
                    - updatedAt
                    - accountId
                    - userId
                    - scopes
        "400":
